<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Página no encontrada | nsma.dev</title>
    <!-- Static page outside the app bundle: the values copy src/styles/tokens.css (ink, fg, fg-muted, primary-300). -->
    <style>
      :root {
        --color-ink: 10 10 15;
        --color-fg: 255 255 255;
        --color-fg-muted: 180 180 184;
        --color-primary-300: 184 184 255;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: rgb(var(--color-ink));
        color: rgb(var(--color-fg));
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: rgb(var(--color-fg-muted));
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0 0.5rem;
        color: rgb(var(--color-primary-300));
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Página no encontrada · <span lang="en">Page not found</span></h1>
      <p>Esta dirección no existe. <span lang="en">This address does not exist.</span></p>
      <nav aria-label="Inicio">
        <a href="/">Ir al inicio</a>
        <a href="/en" hreflang="en" lang="en">Go to the home page</a>
      </nav>
    </main>
  </body>
</html>
